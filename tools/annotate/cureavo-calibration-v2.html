<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' file:; style-src 'unsafe-inline'; img-src data: https://cdn.shopify.com; connect-src 'none'; form-action 'none'">
<title>CureAvo calibration</title>
<style>
  :root { --bg:#FBF7EC; --ink:#1C2A22; --muted:#5D6A61; --accent:#23412F; --line:#d9d2c0; --card:#fff; --pick:#EBCB6B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom: 12px; }
  .progress { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; min-width:120px; }
  .progress > div { height:100%; background:var(--accent); }
  .q { font-size: 18px; font-weight: 600; margin: 8px 0 12px; }
  .imgs { display:grid; gap:12px; }
  .imgs.two { grid-template-columns: 1fr 1fr; }
  .imgs.trip { grid-template-columns: 1fr 1fr; }
  .imgs.trip .anchor { grid-column: 1 / span 2; justify-self:center; width: 46%; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
  figure img { width:100%; height:auto; max-height: 210px; object-fit: contain; display:block; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: .06em; text-transform: uppercase; }
  .choices { display:flex; gap:8px; flex-wrap:wrap; margin: 16px 0 8px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--card); color: var(--ink); cursor: pointer; min-height: 44px; }
  button.primary { background: var(--accent); color: #fff; }
  button.sel { background: var(--pick); border-color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dim { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
  .dimhead { font-size: 15px; }
  .small { font-size: 13px; margin: 4px 0 0; }
  button[disabled] { opacity: .45; cursor: default; }
  .conf { display:flex; gap:8px; align-items:center; margin: 8px 0 16px; flex-wrap: wrap; }
  .attr { display:grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items:center; margin: 12px 0; }
  select, input[type=text] { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size: 13px; background:#fff; }
  @media (max-width: 640px) { .imgs.trip .anchor { width: 100%; } .attr { grid-template-columns: 1fr; } }
</style>

  const done = new Set(state.answers.map((a) => a.questionId));
  state.idx = state.order.findIndex((i) => !done.has(state.pack.questions[i].id));
  if (state.idx < 0) return finish();
  render();
}

  app.append(el('h1', { text: 'CureAvo design labelling' }));
  app.append(el('div', { class: 'card' }, el('p', { text: 'You will compare drawings or photos of furniture. Most screens ask two separate questions:' }), el('p', {}, el('strong', { text: 'Structure' }), ' is the shape and build: silhouette, proportions, curves and edges, legs or base. Colour and finish do not count.'), el('p', {}, el('strong', { text: 'Overall look' }), ' is everything you would notice when deciding if you like it: the shape AND the colour, wood tone, finish, texture and how heavy or light it looks.'), el('p', { text: 'For both, ignore the photography (background, room, lighting). Go with your first honest reading; "Can\'t tell" is a fine answer. There are no right answers to look up, and no computer model has answered these.' }), el('p', { class: 'muted', text: 'Your progress stays in this browser and nothing is uploaded. When you finish, you download one file and send it back.' })));
