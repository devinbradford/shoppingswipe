# Visual-model throughput benchmark on CureAvo's OWN synthetic drawings only (no retailer images).
# Manual only: Actions tab → "vision-benchmark" → Run workflow. Downloads the pinned open-source
# model weights onto GitHub's runner, measures them, and uploads results.json + models.lock.json.
# Nothing here touches the app, the database, secrets or any product photo.
name: vision-benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/vision-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchvision==0.29.2
      - run: pip install -r requirements.txt
      - run: python measure_models.py --self-test
      - run: python measure_models.py --resolve-revisions
      - run: python measure_models.py --measure --yes-download --threads 4 --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: vision-benchmark
          path: |
            tools/vision-models/results.json
            tools/vision-models/models.lock.json
